# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    # One entry, not one per package: the pnpm workspace root owns the single
    # lockfile, and Dependabot updates every workspace manifest from there.
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "npm"
      - "Dependabot"
    groups:
      # @angular/core peer-depends on an exact @angular/compiler version, and
      # ng-packagr peer-depends on @angular/compiler-cli. Bumping any of them
      # alone builds green against a skewed compiler.
      angular:
        patterns:
          - "@angular/*"
          - "ng-packagr"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "react-i18next"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
    assignees:
      - "bpapillon"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "github-actions"
      - "Dependabot"
    assignees:
      - "mhmdio"
