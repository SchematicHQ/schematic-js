# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directories:
      - "/angular"
      - "/components"
      - "/js"
      - "/react"
      - "/vue"
    schedule:
      interval: "daily"
    labels:
      - "npm"
      - "Dependabot"
    groups:
      # Dependabot puts a dependency in the first group it matches, so the
      # vendor lockstep sets stay above the catch-all.
      #
      # @angular/core peer-depends on an exact @angular/compiler version, and
      # ng-packagr peer-depends on @angular/compiler-cli. Bumping any of them
      # alone builds green against a skewed compiler.
      angular:
        patterns:
          - "@angular/*"
          - "ng-packagr"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The same tooling (eslint, typescript-eslint, prettier, vitest,
      # happy-dom, api-extractor) lives in every package, so one upstream
      # release used to land as four or five PRs. One group across every
      # directory takes it as a single PR per run. Majors still arrive alone,
      # and @schematichq/* stays out so our own SDK bumps arrive on their own.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "@schematichq/*"
    ignore:
      - dependency-name: "react-i18next"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
    assignees:
      - "bpapillon"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "github-actions"
      - "Dependabot"
    assignees:
      - "mhmdio"
