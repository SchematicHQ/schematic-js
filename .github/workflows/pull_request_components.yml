name: Pull request - schematic-components

on:
  pull_request:
    # The workspace links this package to js and react, so a change there is a
    # change here.
    paths:
      - components/**
      - js/**
      - react/**
      - .github/workflows/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  build:
    name: Build
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@schematichq/schematic-components..."
      - name: Build
        run: pnpm --filter "@schematichq/schematic-components..." run build

  lint:
    name: Lint
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@schematichq/schematic-components..."
      - name: Build workspace dependencies
        run: pnpm --filter "@schematichq/schematic-components^..." run build
      - name: Lint
        run: pnpm --filter "@schematichq/schematic-components" run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    strategy:
      matrix:
        node-version: [24.18.0, 26.5.0]
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@schematichq/schematic-components..."
      - name: Build workspace dependencies
        run: pnpm --filter "@schematichq/schematic-components^..." run build
      - name: Test
        run: pnpm --filter "@schematichq/schematic-components" run test
