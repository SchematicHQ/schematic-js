name: Deploy schematic-react

on:
  push:
    tags:
      - 'schematic-react@*'
  workflow_dispatch:

permissions: {}

jobs:
  lint_test:
    name: Lint and Test
    permissions:
      contents: read
    uses: ./.github/workflows/lint_test.yml
    with:
      package: schematic-react
      working_dir: react

  publish:
    name: NPM Publish
    needs: [lint_test]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/npm_publish.yml
    with:
      tag: ${{ github.ref_name }}

  update_example_app:
    name: Update ${{ matrix.repo }}
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/spot=false
    timeout-minutes: 15
    needs: [publish]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: [schematic-next-example, schematic-next-example-orb]
    steps:
      - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670 # v2.7.1
      - name: Checkout schematic-react
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: schematic-react
          persist-credentials: false

      - name: Get react version
        id: get_version
        run: |
          cd schematic-react/react
          echo "SCHEMATIC_REACT_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Credentials stay persisted: create-pull-request pushes from this
      # checkout with GH_TOKEN.
      - name: Checkout example app  # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schematichq/${{ matrix.repo }}
          path: ${{ matrix.repo }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Enable corepack
        run: corepack enable pnpm

      - name: Wait for version on npm
        env:
          VERSION: ${{ steps.get_version.outputs.SCHEMATIC_REACT_VERSION }}
        run: |
          # The registry can lag the publish job by a minute or two.
          for _ in $(seq 1 30); do
            npm view "@schematichq/schematic-react@${VERSION}" version && exit 0
            sleep 10
          done
          exit 1

      - name: Update example app dependencies
        working-directory: ${{ matrix.repo }}
        env:
          VERSION: ${{ steps.get_version.outputs.SCHEMATIC_REACT_VERSION }}
        run: pnpm add "@schematichq/schematic-react@${VERSION}"

      - name: Check for changes
        id: check_changes
        working-directory: ${{ matrix.repo }}
        run: git diff --exit-code || echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check_changes.outputs.HAS_CHANGES == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: Update @schematichq/schematic-react to ${{ steps.get_version.outputs.SCHEMATIC_REACT_VERSION }}
          title: Update @schematichq/schematic-react to ${{ steps.get_version.outputs.SCHEMATIC_REACT_VERSION }}
          body: |
            This PR updates the @schematichq/schematic-react package to version ${{ steps.get_version.outputs.SCHEMATIC_REACT_VERSION }}.

            This update was automatically created by the schematic-react deployment process.
          branch: schematic-react-${{ steps.get_version.outputs.SCHEMATIC_REACT_VERSION }}
          base: main
          delete-branch: true
          path: ${{ matrix.repo }}

  notify_slack:
    name: Notify Slack
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-arm64/spot=capacity-optimized
    timeout-minutes: 5
    needs: [publish]
    permissions: {}
    steps:
      - uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: Updated schematic-react
          SLACK_ICON: https://schematic-public-assets.s3.amazonaws.com/logos/logo-transparent.png
