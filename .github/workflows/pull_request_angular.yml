name: Pull request - schematic-angular

on:
  pull_request:
    paths:
      - angular/**
      - .github/workflows/**
      - scripts/**

jobs:
  build:
    name: Build
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        working-directory: ./angular
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ./angular
        run: pnpm run build

  lint:
    name: Lint
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        working-directory: ./angular
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ./angular
        run: pnpm run lint

  test:
    name: Test
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        working-directory: ./angular
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: ./angular
        run: pnpm run test
