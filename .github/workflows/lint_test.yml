name: Lint and Test

on:
  workflow_call:
    inputs:
      package:
        description: 'Package name (schematic-js, schematic-react, schematic-components, schematic-vue, schematic-angular)'
        required: true
        type: string

jobs:
  lint:
    name: Lint
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      # Installs from the workspace root. The trailing `...` narrows it to this
      # package plus its workspace dependencies, so a job never pays for the
      # other frameworks' trees.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@schematichq/${{ inputs.package }}..."
      # `<pkg>^...` is the dependencies alone. They have to be built first: a
      # `workspace:` link resolves to the sibling's `dist/`, which is
      # gitignored, so tsc and eslint see nothing until it exists. No-ops (exit
      # 0) for packages with no workspace dependencies.
      - name: Build workspace dependencies
        run: pnpm --filter "@schematichq/${{ inputs.package }}^..." run build
      - name: Lint
        run: pnpm --filter "@schematichq/${{ inputs.package }}" run lint

  test:
    name: Test
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@schematichq/${{ inputs.package }}..."
      - name: Build workspace dependencies
        run: pnpm --filter "@schematichq/${{ inputs.package }}^..." run build
      - name: Test
        run: pnpm --filter "@schematichq/${{ inputs.package }}" run test
      - name: Test (React Native)
        if: inputs.package == 'schematic-js' || inputs.package == 'schematic-react'
        run: pnpm --filter "@schematichq/${{ inputs.package }}" run test:reactnative
