name: Lint and Test

on:
  workflow_call:
    inputs:
      package:
        description: 'Package name (schematic-js, schematic-react, schematic-components, schematic-vue)'
        required: true
        type: string
      working_dir:
        description: 'Working directory (js, react, components, vue)'
        required: true
        type: string

jobs:
  lint:
    name: Lint
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        working-directory: ./${{ inputs.working_dir }}
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ./${{ inputs.working_dir }}
        run: pnpm run lint

  test:
    name: Test
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable corepack
        run: corepack enable pnpm
      - name: Install dependencies
        working-directory: ./${{ inputs.working_dir }}
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: ./${{ inputs.working_dir }}
        run: pnpm run test
      - name: Test (React Native)
        if: inputs.package == 'schematic-js' || inputs.package == 'schematic-react'
        working-directory: ./${{ inputs.working_dir }}
        run: pnpm run test:reactnative
