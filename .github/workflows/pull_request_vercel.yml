name: Clone Demo App & Deploy to Vercel

on:
  pull_request:
    paths:
      - components/**
      # Run when the pipeline itself changes, not only the package.
      - .github/workflows/pull_request_vercel.yml
      - .github/actions/setup-pnpm/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: "66.6.0"
  DEMO_APP_REPO: 'schematichq/schematic-next-example'

jobs:
  deploy:
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache/spot=capacity-optimized
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670 # v2.7.1
      - name: Checkout Components Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          project: components

      - name: Install Vercel CLI
        run: npm install --global vercel@"${VERCEL_CLI_VERSION}" --ignore-scripts

      - name: Build Components Package
        working-directory: components
        run: |
          echo "🔨 Building components package..."
          pnpm install --frozen-lockfile
          pnpm run build

      # Packing is the truer test: it exercises the `files` list and `exports`
      # map the demo app would get from npm, which a symlink bypasses.
      - name: Pack components
        id: pack
        working-directory: components
        run: echo "tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Clone Demo App
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEMO_APP_REPO }}
          path: schematic-next-example
          persist-credentials: false

      - name: Setup Demo App & Install Components
        working-directory: schematic-next-example
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          echo "🏠 Setting up demo app..."
          echo "📦 Installing demo app dependencies against the packed build..."
          pnpm add "${TARBALL}"
          echo "✅ Components package installed successfully!"

      - name: Pull Vercel Environment Information
        working-directory: schematic-next-example
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link --yes --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          vercel env pull --yes --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          vercel pull --yes --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Build Project for Vercel
        working-directory: schematic-next-example
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🏗️ Building Next.js app for Vercel..."
          vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (Preview)
        id: vercel
        working-directory: schematic-next-example
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🚀 Deploying Preview to Vercel..."
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "Preview URL: $DEPLOYMENT_URL"

      - name: Comment PR with Preview URL
        if: env.DEPLOYMENT_URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Components Preview Deployed!**

              📍 **Preview URL:** ${deploymentUrl}
              🔄 **Components Version:** Built from commit \`${context.sha.substring(0, 7)}\`
              📦 **Demo App:** ${process.env.DEMO_APP_REPO}

              `
            });

      - name: Create Deployment Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🚀 Deployment Summary"
            echo ""
            if [ "$JOB_STATUS" == "success" ]; then
              echo "✅ **Status:** Deployment completed successfully!"
              echo "🔗 **URL:** ${DEPLOYMENT_URL:-}"
              echo "📦 **Demo App:** ${DEMO_APP_REPO}"
              echo "🔄 **Components:** Built from commit \`${GITHUB_SHA}\`"
            else
              echo "❌ **Status:** Deployment failed!"
              echo "📋 Check the workflow logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
