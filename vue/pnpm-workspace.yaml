# Refuse to resolve a version published in the last 24h — the window in which a
# hijacked-maintainer release usually gets yanked. Frozen installs unaffected.
minimumReleaseAge: 1440

# Auto-install when node_modules has drifted from the lockfile, so a script
# never silently runs against a stale tree.
verifyDepsBeforeRun: install

# No `frozenLockfile: true`, deliberately: it would stop the auto-install above
# re-resolving the ranges below, but Dependabot's `pnpm update --no-save` then
# dies ERR_PNPM_OUTDATED_LOCKFILE. CI installs are frozen anyway (pnpm reads
# CI=true), so it only ever covered developer machines.

overrides:
  handlebars: ">=4.7.9"
  lodash: ">=4.18.0"
  minimatch: ">=3.1.3"
  # yarn spelled these `**/<parent>/<child>`; pnpm scopes an override to a
  # parent with `<parent>><child>`.
  "@eslint/eslintrc>js-yaml": 4.3.1
  "@istanbuljs/load-nyc-config>js-yaml": 3.15.1

allowBuilds:
  # Denied on purpose. esbuild's postinstall is only an optimization: it moves
  # the platform binary from the @esbuild/<platform> optional dependency over
  # `esbuild/bin/esbuild`, saving one process spawn per invocation. It skips
  # that under yarn, which is why this never bit us before. pnpm has already
  # written node_modules/.bin/esbuild as a shim that runs the file through
  # node, so after the swap `pnpm exec esbuild` feeds node a Mach-O binary and
  # dies on "Invalid or unexpected token". Left unbuilt, bin/esbuild stays the
  # JS launcher and spawns the same platform binary itself.
  esbuild: false
  # Native bindings that ship prebuilt per-platform packages as optional
  # dependencies. Their install scripts only compile or fetch a binding when
  # the matching optional package is missing, which it never is here.
  unrs-resolver: false
